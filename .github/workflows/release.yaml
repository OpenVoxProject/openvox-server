---
name: Release and publish package to clojars.org

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to release from.'
        type: choice
        options:
          - main
          - '8.x'
        default: 'main'

jobs:
  release:
    uses: 'openvoxproject/shared-actions/.github/workflows/clojure_release.yml@main'
    with:
      base-branch: ${{ inputs.branch }}
      java-version: ${{ case(inputs.branch == '8.x', '17', '21') }}
      include_changelog_in_release: true
      post-version-change: ruby scripts/sync_ezbake_dep.rb
    secrets:
      github_pat: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}
      ssh_private_key: ${{ secrets.OPENVOXBOT_SSH_PRIVATE_KEY }}
      clojars_username: ${{ secrets.CLOJARS_USERNAME }}
      clojars_password: ${{ secrets.CLOJARS_PASSWORD }}

  build:
    needs: release
    uses: $/.github/workflows/build.yml
    with:
      ref: ${{ needs.release.outputs.version }}
      branch: ${{ inputs.branch }}
    secrets: inherit
