---
name: Build openvox-server

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Tag to build for a release, or branch to build for a pre-release.
        required: true
      branch:
        description: >-
          The default platform list to build for. Use `main` for 9.x builds
          and `8.x` for 8.x builds.
        type: choice
        options:
          - main
          - '8.x'
        default: 'main'
      deb_platform_list:
        description: >-
          A comma-separated list of deb-based platforms to build for, excluding
          the architecture (e.g. ubuntu-24.04,debian-12). Do not include spaces.
          If not provided, will use the default list of platforms chosen above.
        required: false
        type: string
      rpm_platform_list:
        description: >-
          A comma-separated list of rpm-based platforms to build for, excluding
          the architecture (e.g. el-9,amazon-2023). Do not include spaces.
          If not provided, will use the default list of platforms chosen above.
        required: false
        type: string
      ezbake-ref:
        description: |-
          Branch/tag from ezbake that will be used for openvoxdb/server builds.
        type: string
        default: 'main'
      ezbake-2-ver:
        description: 'The version specified in project.clj in the given ezbake-ref. Will default to the version 2.x. Used for distros with systemd 252 or older'
        type: string
        required: false
      ezbake-4-ver:
        description: 'The version specified in project.clj in the given ezbake-ref. Will default to the version 4.x. Used for distros with systemd 253 or newer. Only used for openvox9+'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build OpenVox-Server ${{ inputs.ref }}
    uses: 'openvoxproject/shared-actions/.github/workflows/build_ezbake.yml@ezbake4'
    with:
      branch: ${{ inputs.branch }}
      ref: ${{ inputs.ref }}
      deb_platform_list: ${{ inputs.deb_platform_list }}
      rpm_platform_list: ${{ inputs.rpm_platform_list }}
      ezbake-ref: ${{ inputs.ezbake-ref }}
      ezbake-2-ver: ${{ inputs.ezbake-2-ver }}
      ezbake-4-ver: ${{ inputs.ezbake-4-ver }}
    secrets: inherit
