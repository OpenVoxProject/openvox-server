---
name: PR Testing

on:
  pull_request: { branches: ['main'] }
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clojure-tests:
    name: Clojure Tests - Java ${{ matrix.version }} ${{ matrix.filter }} ${{ matrix.javaargs }}
    strategy:
      fail-fast: false
      matrix:
        javaargs: ['with-profile fips', '']
        filter: [':singlethreaded', ':multithreaded']
        version: ['21', '25']
        exclude:
          - javaargs: 'with-profile fips'
            version: '21'
            filter: ':multithreaded'
          - javaargs: 'with-profile fips'
            version: '21'
            filter: ':singlethreaded'
          - javaargs: 'with-profile fips'
            version: '25'
            filter: ':multithreaded'
          - javaargs: 'with-profile fips'
            version: '25'
            filter: ':singlethreaded'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: setup java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.version }}
          verify-signature: true
      - name: setup ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.1'
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          lein: latest
      - name: setup gems
        run: ./dev-setup
      - name: clojure tests
        run: lein -U ${{ matrix.javaargs }} test ${{ matrix.filter }}
        timeout-minutes: 30

  rspec-tests:
    name: Rspec Tests - Java ${{ matrix.java }} Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
        # The specs always run under the JRuby pinned via jruby-utils
        # (see Rakefile: lein run -m org.jruby.Main); this MRI only drives
        # rake and dev-setup, so one version suffices. Match the reference
        # Ruby used by the build job / Dockerfile.
        ruby: ['3.3']
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: setup ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: setup java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          verify-signature: true
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          lein: latest
      - name: setup gems
        run: ./dev-setup
      - name: rspec tests
        run: rake spec

  # The package build mirrors the release workflow: the uberjar project once
  # per variant, then openvox-server for a few platforms. The uberjar archives
  # travel between the jobs as workflow artifacts instead of the S3 bucket.
  uberjar:
    name: uberjar ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: ['el-9-x86_64', 'redhatfips-9-x86_64']
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # So we fetch all history and tags and can build non-tagged versions
      - name: setup ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: build the uberjar archive
        run: bundle exec rake "vox:build[openvox-server-uberjar,${{ matrix.platform }}]"
      - name: Upload the uberjar archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uberjar-${{ matrix.platform }}
          path: packaging/output/
          retention-days: 1
          overwrite: true

  packages:
    name: package ${{ matrix.platform }}
    needs: uberjar
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: ['el-9-x86_64', 'ubuntu-24.04-amd64', 'redhatfips-9-x86_64']
    env:
      # The rake task expects the archives on S3 when it runs in CI, so point
      # it at the ones downloaded from the uberjar jobs instead
      SERVER_TARBALL_BASE: file://${{ github.workspace }}/packaging/output
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # So we fetch all history and tags and can build non-tagged versions
      - name: setup ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Download the uberjar archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: uberjar-*
          path: packaging/output/
          merge-multiple: true
      - name: build the package
        run: bundle exec rake "vox:build[openvox-server,${{ matrix.platform }}]"
      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}
          path: |
            packaging/output/**/*.rpm
            packaging/output/**/*.deb
            packaging/output/openvox-server-*.tar.gz
            !packaging/output/openvox-server-uberjar-*
          retention-days: 1
          overwrite: true

  build:
    name: build openvox-server
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # So we fetch all history and tags and can build non-tagged versions
      - name: Download everything the build jobs produced
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: output/
          merge-multiple: true
      - name: get version
        id: version
        run: |
          DESCRIBE=$(git describe --abbrev=9)
          echo "describe=${DESCRIBE//-/.}" >> $GITHUB_OUTPUT
      - name: Upload build artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openvox-server-${{ steps.version.outputs.describe }}.zip
          path: output/
          retention-days: 1 # quite low retention, because the artifacts are quite large
          overwrite: true # overwrite old artifacts if a PR runs again (artifacts are per PR * per project)
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        # Check if the event is not triggered by a fork
        # https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#restrictions-on-repository-forks
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- build-artifacts -->'
      - name: Add or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |-
            <!-- build-artifacts -->
            The el-9, ubuntu-24.04 and redhatfips-9 packages, the uberjar archives and the source tarball for openvox-server are available in a zip archive:
            ${{ steps.upload.outputs.artifact-url }}

  clojure-linting:
    name: Clojure Linting
    runs-on: ubuntu-latest
    steps:
      - name: setup java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          verify-signature: true
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # newer versions cause lint errors
      # https://github.com/clj-kondo/clj-kondo/releases
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          clj-kondo: 2025.02.20
      - name: kondo lint
        run: clj-kondo --lint src test

  tests:
    if: always()
    needs:
      - clojure-tests
      - rspec-tests
      - clojure-linting
      - build
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  automerge:
    name: Enable auto-merge
    if: github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]')
    needs:
      - tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --merge --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
